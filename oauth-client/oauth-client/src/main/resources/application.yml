logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:DEBUG}
    # org.springframework.web: ${LOG_LEVEL_SPRING_WEB:DEBUG}

server:
  servlet:
    session:
      cookie:
        name: ${SESSION_COOKIE_NAME:OAUTH_CLIENT_SESSION}

spring:
  security:
    oauth2:
      client:
        registration:
          oauth-client:
            provider: ${OAUTH_PROVIDER:oauth-server}
            client-id: ${OAUTH_CLIENT_ID:oauth-client}
            client-secret: ${OAUTH_CLIENT_SECRET:12345678910}
            authorization-grant-type: ${OAUTH_GRANT_TYPE:authorization_code}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: ${OAUTH_CLIENT_NAME:oauth-client}
            scope: ${OAUTH_SCOPE:openid,profile,read,write}

        provider:
          oauth-server:
            issuer-uri: ${OAUTH_ISSUER_URI:http://127.0.0.1:9000}

  cloud:
    openfeign:
      oauth2:
        enabled: ${FEIGN_OAUTH2_ENABLED:true}
        clientRegistrationId: ${FEIGN_OAUTH2_CLIENT_REGISTRATION_ID:oauth-client}

      client:
        config:
          userClient:
            url: ${USER_CLIENT_URL:http://127.0.0.1:8081}